# Der Weg, der funktioniert (seit 06.11.2026 in Betrieb). Er benutzt die
# Pages-Deployment-Schnittstelle nicht, denn die bleibt in "deployment_queued" haengen:
# er baut die App und legt nur den Inhalt von build/ in den Zweig gh-pages.
# Pages veroeffentlicht diesen Zweig ueber die aeltere, getrennte Pipeline.
#
# Voraussetzung, einmalig: Settings -> Pages -> Source "Deploy from a branch",
# Branch gh-pages, Ordner / (root).
#
# Der offizielle Weg liegt daneben in pages.yml und laeuft nur noch von Hand.
name: Pages ueber gh-pages-Zweig

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-zweig
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keine Datendatei im Repo
        run: |
          if git ls-files | grep -qiE 'finanzdaten|sicherungen/'; then
            echo "FEHLER: Datendatei oder Sicherung im Repo gefunden."; git ls-files | grep -iE 'finanzdaten|sicherungen/'; exit 1
          fi

      - name: Bauen und prüfen
        run: bash src/build.sh

      - name: build/ in den Zweig gh-pages schreiben
        run: |
          cd build
          touch .nojekyll          # keine Jekyll-Verarbeitung, die Dateien sind fertig
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Veröffentlicht aus ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "gh-pages aktualisiert. Pages-Source auf 'Deploy from a branch' / gh-pages / (root) stellen."

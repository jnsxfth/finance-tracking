# GEPARKT seit 06.11.2026. Der offizielle Weg ueber die Pages-Deployment-Schnittstelle:
# Build und Artefakt-Upload gelingen, aber deploy-pages bleibt in "deployment_queued"
# haengen und bricht mit "Deployment failed, try again later" ab (Fehler bei GitHub,
# nicht hier). Veroeffentlicht wird darum ueber pages-zweig.yml.
#
# Laeuft nur noch von Hand. Wenn GitHub den Fehler behoben hat: diesen Workflow starten,
# und wenn er durchlaeuft, Settings -> Pages -> Source zurueck auf "GitHub Actions"
# stellen und pages-zweig.yml auf workflow_dispatch zurueckstellen. Nie beide Wege
# gleichzeitig veroeffentlichen lassen.
name: Pages (offizieller Weg, geparkt)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Notbremse: eine Datendatei darf nie im Repo liegen, auch nicht versehentlich.
      - name: Keine Datendatei im Repo
        run: |
          if git ls-files | grep -qiE 'finanzdaten|sicherungen/'; then
            echo "FEHLER: Datendatei oder Sicherung im Repo gefunden."; git ls-files | grep -iE 'finanzdaten|sicherungen/'; exit 1
          fi

      - name: Bauen und prüfen
        run: bash src/build.sh

      # enablement schaltet Pages notfalls selbst ein. Ohne das scheitert der erste Lauf
      # mit "Get Pages site failed", wenn er vor dem Umstellen auf GitHub Actions startet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
